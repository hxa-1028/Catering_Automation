[project]
name = "catering-proposal-agent"
version = "0.1.0"
description = "AI-assisted catering proposal platform with human-reviewed, source-backed drafts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.0,<2.0.0",
    "fastapi>=0.128.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "psycopg[binary]>=3.3.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "structlog>=25.5.0,<26.0.0",
    "tenacity>=9.1.0,<10.0.0",
    "uvicorn[standard]>=0.40.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.19.0,<2.0.0",
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catering_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
warn_unused_configs = true
